<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 - Quick Reflection</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/Task1/task1-survey.css" />
  </head>
  <body>
    <div class="survey-container">
      <div class="survey-header">
        <h1 class="survey-title">Quick Reflection - Task 1</h1>
        <p class="survey-subtitle">
          You just experienced two different design approaches. Let's capture
          your thoughts while they're fresh.
        </p>
      </div>

      <div class="mode-preview-section" aria-label="Mode previews">
        <p class="mode-preview-label">Need a quick reminder?</p>
        <div class="mode-preview-buttons">
          <button
            type="button"
            class="preview-btn"
            data-preview-mode="modeA"
            data-preview-src="../assets/task1-mode-a.png"
            data-preview-title="Mode A Preview"
            data-preview-alt="Static screenshot preview of Task 1 Mode A interface"
          >
            Mode A preview
          </button>
          <button
            type="button"
            class="preview-btn"
            data-preview-mode="modeB"
            data-preview-src="../assets/task1-mode-b.png"
            data-preview-title="Mode B Preview"
            data-preview-alt="Static screenshot preview of Task 1 Mode B interface"
          >
            Mode B preview
          </button>
        </div>
      </div>

      <form id="surveyForm" class="survey-form">
        <!-- Question 1: Mental Clarity -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">1.</span>
            In which mode did you experience greater mental clarity and focus?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="q1_clarity" value="overload" required />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_clarity" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_clarity" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Question 2: Emotional Response -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">2.</span>
            How did you feel during each mode?
          </label>

          <div class="sub-question">
            <p class="mode-label">Mode A felt:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input
                  type="radio"
                  name="q2_overload_feeling"
                  value="1"
                  required
                />
                <span>Very Stressful</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_feeling" value="2" />
                <span>Stressful</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_feeling" value="3" />
                <span>Neutral</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_feeling" value="4" />
                <span>Calm</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_feeling" value="5" />
                <span>Very Calm</span>
              </label>
            </div>
          </div>

          <div class="sub-question">
            <p class="mode-label">Mode B felt:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input type="radio" name="q2_zen_feeling" value="1" required />
                <span>Very Stressful</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_feeling" value="2" />
                <span>Stressful</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_feeling" value="3" />
                <span>Neutral</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_feeling" value="4" />
                <span>Calm</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_feeling" value="5" />
                <span>Very Calm</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Question 3: Sense of Control -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">3.</span>
            In which mode did you feel greater control over your actions?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="q3_control" value="overload" required />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_control" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_control" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Optional Comments -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">4.</span>
            Additional remarks (optional):
          </label>
          <textarea
            name="q4_comments"
            class="comment-box"
            placeholder="Share your observations or reflections about the two experiences…"
            rows="4"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">
          Next Task →
        </button>
      </form>
    </div>

    <div
      id="modePreviewModal"
      class="preview-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modePreviewTitle"
      hidden
    >
      <div class="preview-modal-content">
        <button
          type="button"
          id="modePreviewClose"
          class="preview-close-btn"
          aria-label="Close preview"
        >
          &times;
        </button>
        <h2 id="modePreviewTitle" class="preview-modal-title">Mode Preview</h2>
        <img id="modePreviewImage" class="preview-modal-image" alt="" />
      </div>
    </div>

    <script src="../js/data-sender.js"></script>
    <script src="../js/Task1/task1-survey.js"></script>
  </body>
</html>
