<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5 - Final Reflection</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/Task5/task5-survey.css" />
  </head>
  <body>
    <div class="survey-container">
      <div class="survey-header">
        <h1 class="survey-title">Quick Reflection - Task 5</h1>
        <p class="survey-subtitle">
          You just tried to focus on a simple task in two very different
          environments.
        </p>
      </div>

      <div class="mode-preview-section" aria-label="Mode previews">
        <p class="mode-preview-label">Need a quick reminder?</p>
        <div class="mode-preview-buttons">
          <button
            type="button"
            class="preview-btn"
            data-preview-mode="modeA"
            data-preview-src="../assets/task5-mode-a.png"
            data-preview-title="Mode A Preview"
            data-preview-alt="Static screenshot preview of Task 5 Mode A interface"
          >
            Mode A preview
          </button>
          <button
            type="button"
            class="preview-btn"
            data-preview-mode="modeB"
            data-preview-src="../assets/task5-mode-b.png"
            data-preview-title="Mode B Preview"
            data-preview-alt="Static screenshot preview of Task 5 Mode B interface"
          >
            Mode B preview
          </button>
        </div>
      </div>

      <form id="surveyForm" class="survey-form">
        <!-- Question 1: Focus & Concentration -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">1.</span>
            Which mode made concentrating on the reading easier for you?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="q1_focus" value="overload" required />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_focus" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_focus" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Question 2: Distraction Level -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">2.</span>
            How distracted did you feel during the task?
          </label>

          <div class="sub-question">
            <p class="mode-label">Mode A:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input
                  type="radio"
                  name="q2_overload_distraction"
                  value="1"
                  required
                />
                <span>Not Distracted</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_distraction" value="2" />
                <span>Slightly</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_distraction" value="3" />
                <span>Moderately</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_distraction" value="4" />
                <span>Very</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_distraction" value="5" />
                <span>Extremely</span>
              </label>
            </div>
          </div>

          <div class="sub-question">
            <p class="mode-label">Mode B:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input
                  type="radio"
                  name="q2_zen_distraction"
                  value="1"
                  required
                />
                <span>Not Distracted</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_distraction" value="2" />
                <span>Slightly</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_distraction" value="3" />
                <span>Moderately</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_distraction" value="4" />
                <span>Very</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_distraction" value="5" />
                <span>Extremely</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Question 3: Task Completion -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">3.</span>
            In which mode did you feel you could complete the task more
            effectively?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input
                type="radio"
                name="q3_effectiveness"
                value="overload"
                required
              />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_effectiveness" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_effectiveness" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Optional Comments -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">4.</span>
            Final thoughts about your experience? (Optional)
          </label>
          <textarea
            name="q4_comments"
            class="comment-box"
            placeholder="How did the interruptions affect your focus? Which design felt more respectful of your attention?"
            rows="4"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Complete Study →</button>
      </form>
    </div>

    <div
      id="modePreviewModal"
      class="preview-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modePreviewTitle"
      hidden
    >
      <div class="preview-modal-content">
        <button
          type="button"
          id="modePreviewClose"
          class="preview-close-btn"
          aria-label="Close preview"
        >
          &times;
        </button>
        <h2 id="modePreviewTitle" class="preview-modal-title">Mode Preview</h2>
        <img id="modePreviewImage" class="preview-modal-image" alt="" />
      </div>
    </div>

    <script src="../js/data-sender.js"></script>
    <script src="../js/Task5/task5-survey.js"></script>
  </body>
</html>
