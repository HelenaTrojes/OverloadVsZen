<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2 - Quick Reflection</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/Task2/task2-survey.css" />
  </head>
  <body>
    <div class="survey-container">
      <div class="survey-header">
        <h1 class="survey-title">Quick Reflection - Task 2</h1>
        <p class="survey-subtitle">
          You just completed a form in two different ways. How did each feel to you?
        </p>
      </div>

      <form id="surveyForm" class="survey-form">
        <!-- Question 1: Ease of Use -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">1.</span>
            Which mode made it easier to complete the form?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="q1_ease" value="overload" required />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_ease" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q1_ease" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Question 2: Confidence -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">2.</span>
            How confident are you that your form was submitted successfully?
          </label>

          <div class="sub-question">
            <p class="mode-label">Mode A:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input
                  type="radio"
                  name="q2_overload_confidence"
                  value="1"
                  required
                />
                <span>Very Unsure</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_confidence" value="2" />
                <span>Unsure</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_confidence" value="3" />
                <span>Neutral</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_confidence" value="4" />
                <span>Confident</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_overload_confidence" value="5" />
                <span>Very Confident</span>
              </label>
            </div>
          </div>

          <div class="sub-question">
            <p class="mode-label">Mode B:</p>
            <div class="likert-scale">
              <label class="likert-option">
                <input
                  type="radio"
                  name="q2_zen_confidence"
                  value="1"
                  required
                />
                <span>Very Unsure</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_confidence" value="2" />
                <span>Unsure</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_confidence" value="3" />
                <span>Neutral</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_confidence" value="4" />
                <span>Confident</span>
              </label>
              <label class="likert-option">
                <input type="radio" name="q2_zen_confidence" value="5" />
                <span>Very Confident</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Question 3: Frustration -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">3.</span>
            In which mode did you feel more frustration?
          </label>
          <div class="radio-group">
            <label class="radio-option">
              <input
                type="radio"
                name="q3_frustration"
                value="overload"
                required
              />
              <span class="radio-label">Mode A</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_frustration" value="zen" />
              <span class="radio-label">Mode B</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="q3_frustration" value="same" />
              <span class="radio-label">About the same</span>
            </label>
          </div>
        </div>

        <!-- Optional Comments -->
        <div class="question-block">
          <label class="question-label">
            <span class="question-number">4.</span>
            Any reflections on your experiences completing the forms? (Optional)
          </label>
          <textarea
            name="q4_comments"
            class="comment-box"
            placeholder="What made one form easier or more difficult than the other?"
            rows="4"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">
          Next Task →
        </button>
      </form>
    </div>

    <script src="../js/data-sender.js"></script>
    <script src="../js/Task2/task2-survey.js"></script>
  </body>
</html>
